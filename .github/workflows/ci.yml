name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Ubuntu 22.04
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            librsvg2-dev \
            webp-pixbuf-loader \
            libasound2-dev \
            pkg-config rpm desktop-file-utils python3 libarchive-tools zstd

      - name: Verify AppIndicator discovery for Tauri bundling
        run: |
          if ! library_dirs="$(PKG_CONFIG_ALLOW_SYSTEM_LIBS=1 pkg-config --libs-only-L ayatana-appindicator3-0.1)" || [[ -z "$library_dirs" ]]; then
            echo "::error::Tauri bundler requires a nonempty ayatana-appindicator3-0.1 library path from pkg-config."
            exit 1
          fi
          printf 'AppIndicator library search path: %s\n' "$library_dirs"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test frontend
        run: npm run test:frontend

      - name: Rust tests
        run: |
          # Each suite requires an exclusive private parent for synthetic scenes.
          # Keep scenes on failure; never point these variables at user data.
          umask 077
          fixture_root="$(mktemp -d "$RUNNER_TEMP/sonante-rust-fixtures.XXXXXXXX")"
          export FF04_I1A_OWN_FIXTURES="$fixture_root/recovery"
          export FF04_OFFER_OWN_FIXTURES="$fixture_root/offers"
          export FF06_I1A_OWN_FIXTURES="$fixture_root/availability"
          mkdir -m 700 "$FF04_I1A_OWN_FIXTURES" "$FF04_OFFER_OWN_FIXTURES" "$FF06_I1A_OWN_FIXTURES"
          cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      
      - name: Verify packaging versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/verify-packaging.mjs

      - name: Test packaging contracts
        run: python3 -m unittest discover -s tests -p '*packaging_test.py'

      - name: Build native executable
        run: npm run tauri -- build --no-bundle -- --locked

      - name: Inspect native dependencies and GLIBC symbols
        run: bash scripts/inspect-elf.sh src-tauri/target/release/sonante 2.35 | tee native-abi.txt

      - name: Prepare RPM requirements from the built executable
        run: python3 scripts/rpm-elf-deps.py src-tauri/target/release/sonante "$RUNNER_TEMP/sonante-rpm.json"

      - name: Build DEB and RPM packages
        run: npm run tauri -- bundle --bundles deb,rpm --config "$RUNNER_TEMP/sonante-rpm.json"

      - name: Check RPM WebKit dependency resolution without installation
        run: python3 tests/rpm_solver_check.py src-tauri/target/release/bundle/rpm/*.rpm

      - name: Inspect packages and create checksums
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          bash scripts/inspect-packages.sh "$VERSION" | tee package-inspection.txt
          mkdir artifacts
          cp src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm artifacts/
          cp native-abi.txt package-inspection.txt artifacts/
          cd artifacts
          git rev-parse HEAD > source-commit.txt
          sha256sum *.deb *.rpm source-commit.txt > SHA256SUMS-ubuntu.txt
          sha256sum -c SHA256SUMS-ubuntu.txt

      - name: Upload DEB and RPM candidates
        uses: actions/upload-artifact@v4
        with:
          name: sonante-compilation-ubuntu-inputs
          path: artifacts/*
          if-no-files-found: error

      - name: Build Fedora runtime profile executable
        run: |
          # The installed manifest must match the bytes compiled into the app.
          # Preserve the Ubuntu candidates uploaded above before this overlay.
          echo "c93f1ac2dc06a8dcee5101858381efc265c3907e50dc2a334a11d293a21cf02f  packaging/qualified-0.5.4/fedora.runtime.json" | sha256sum -c -
          cp packaging/qualified-0.5.4/fedora.runtime.json packaging/private-runtimes.json
          npm run tauri -- build --no-bundle -- --locked
          mkdir fedora-native
          cp src-tauri/target/release/sonante fedora-native/sonante
          cp packaging/private-runtimes.json fedora-native/manifest.json
          bash scripts/inspect-elf.sh fedora-native/sonante 2.35 | tee fedora-native/native-abi.txt
          python3 -c 'from pathlib import Path; p = Path("fedora-native"); assert (p / "manifest.json").read_bytes() in (p / "sonante").read_bytes()'
          git rev-parse HEAD > fedora-native/source-commit.txt
          cd fedora-native
          sha256sum sonante manifest.json native-abi.txt source-commit.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload Fedora runtime profile executable
        uses: actions/upload-artifact@v4
        with:
          name: sonante-compilation-fedora-inputs
          path: fedora-native/*
          if-no-files-found: error

  arch:
    name: Arch Linux package
    runs-on: ubuntu-22.04
    container: archlinux:base-devel
    steps:
      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm --needed git nodejs npm rust python file binutils \
            gtk3 webkit2gtk-4.1 alsa-lib alsa-utils \
            openssl mpd xdg-utils xdg-desktop-portal desktop-file-utils
      - uses: actions/checkout@v4
      - name: Verify packaging versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/verify-packaging.mjs
      - name: Stage exact checkout and build as an unprivileged user
        run: |
          bash scripts/prepare-arch-ci.sh "$GITHUB_WORKSPACE/arch-build"
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd arch-build
          runuser -u builder -- makepkg --noconfirm --cleanbuild
      - name: Inspect Arch package
        run: |
          cd arch-build
          test "$(find . -maxdepth 1 -name '*.pkg.tar.zst' | wc -l)" = 1
          pacman -Qip ./*.pkg.tar.zst
          pacman -Qlp ./*.pkg.tar.zst
          bsdtar -xOf ./*.pkg.tar.zst .PKGINFO | tee package-info.txt
          VERSION="$(node -p "require('../package.json').version")"
          grep -Fx "pkgver = $VERSION-1" package-info.txt
          for dep in mpd alsa-utils xdg-utils webkit2gtk-4.1; do grep -Fx "depend = $dep" package-info.txt; done
          bsdtar -tf ./*.pkg.tar.zst | grep -Fx usr/bin/sonante
          desktop-file-validate src/sonante.desktop
          bash ../scripts/inspect-elf.sh src/sonante/src-tauri/target/release/sonante | tee native-abi-arch.txt
          runuser -u builder -- git -C .. rev-parse HEAD > source-commit.txt
          sha256sum *.pkg.tar.zst source-commit.txt > SHA256SUMS-arch.txt
          sha256sum -c SHA256SUMS-arch.txt
      - name: Upload Arch candidate
        uses: actions/upload-artifact@v4
        with:
          name: sonante-compilation-arch-inputs
          path: |
            arch-build/*.pkg.tar.zst
            arch-build/SHA256SUMS-arch.txt
            arch-build/package-info.txt
            arch-build/native-abi-arch.txt
            arch-build/source-commit.txt
          if-no-files-found: error


  complete:
    name: Complete Linux installers
    needs: [linux, arch]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install packaging tools only
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils dpkg-dev rpm libarchive-tools zstd python3
      - uses: actions/download-artifact@v4
        with:
          name: sonante-compilation-ubuntu-inputs
          path: ${{ runner.temp }}/sonante-candidates/ubuntu
      - uses: actions/download-artifact@v4
        with:
          name: sonante-compilation-fedora-inputs
          path: ${{ runner.temp }}/sonante-candidates/fedora
      - uses: actions/download-artifact@v4
        with:
          name: sonante-compilation-arch-inputs
          path: ${{ runner.temp }}/sonante-candidates/arch
      - name: Assemble and verify complete installers and corresponding sources
        run: |
          python3 scripts/complete-packages.py \
            --candidates "$RUNNER_TEMP/sonante-candidates" \
            --work-dir "$RUNNER_TEMP/sonante-complete-work" \
            --output "$RUNNER_TEMP/sonante-complete-output" \
            --revision 3
      - name: Upload complete installable packages
        uses: actions/upload-artifact@v4
        with:
          name: sonante-complete-linux-packages
          path: ${{ runner.temp }}/sonante-complete-output/*
          compression-level: 0
          if-no-files-found: error
