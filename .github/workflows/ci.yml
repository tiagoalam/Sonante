name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Ubuntu 22.04
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test localization consistency
        run: npm run test:i18n

      - name: Test Plex artwork cache
        run: node tests/plexArtworkCache.test.mjs

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      
      - name: Build Debian package
        run: npm run tauri -- build --bundles deb -- --locked

      - name: Inspect Debian package
        run: |
          ls -lh src-tauri/target/release/bundle/deb/
          dpkg-deb -I src-tauri/target/release/bundle/deb/*.deb

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: sonante-ubuntu-22.04-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
