name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Optional full commit SHA; defaults to the dispatched commit
        required: false
        type: string
  workflow_call:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA selected for all package jobs
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Ubuntu 22.04
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0

      - name: Verify immutable candidate source
        env:
          SONANTE_CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
          SONANTE_EVENT_SHA: ${{ github.sha }}
        run: python3 scripts/verify-candidate-source.py --candidate-sha "$SONANTE_CANDIDATE_SHA" --event-sha "$SONANTE_EVENT_SHA"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            librsvg2-dev \
            webp-pixbuf-loader \
            libasound2-dev \
            pkg-config rpm desktop-file-utils python3 libarchive-tools zstd

      - name: Verify AppIndicator discovery for Tauri bundling
        run: |
          if ! library_dirs="$(PKG_CONFIG_ALLOW_SYSTEM_LIBS=1 pkg-config --libs-only-L ayatana-appindicator3-0.1)" || [[ -z "$library_dirs" ]]; then
            echo "::error::Tauri bundler requires a nonempty ayatana-appindicator3-0.1 library path from pkg-config."
            exit 1
          fi
          printf 'AppIndicator library search path: %s\n' "$library_dirs"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test frontend
        run: npm run test:frontend

      - name: Rust tests
        run: |
          # Each suite requires an exclusive private parent for synthetic scenes.
          # Keep scenes on failure; never point these variables at user data.
          umask 077
          fixture_root="$(mktemp -d "$RUNNER_TEMP/sonante-rust-fixtures.XXXXXXXX")"
          export FF04_I1A_OWN_FIXTURES="$fixture_root/recovery"
          export FF04_OFFER_OWN_FIXTURES="$fixture_root/offers"
          export FF06_I1A_OWN_FIXTURES="$fixture_root/availability"
          mkdir -m 700 "$FF04_I1A_OWN_FIXTURES" "$FF04_OFFER_OWN_FIXTURES" "$FF06_I1A_OWN_FIXTURES"
          cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      
      - name: Verify packaging versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/verify-packaging.mjs

      - name: Test packaging contracts
        run: python3 -m unittest discover -s tests -p '*packaging_test.py'

      - name: Build native executable
        run: npm run tauri -- build --no-bundle -- --locked

      - name: Inspect native dependencies and GLIBC symbols
        run: bash scripts/inspect-elf.sh src-tauri/target/release/sonante 2.35 openssl3 | tee native-abi.txt

      - name: Prepare RPM requirements from the built executable
        run: python3 scripts/rpm-elf-deps.py src-tauri/target/release/sonante "$RUNNER_TEMP/sonante-rpm.json"

      - name: Build DEB and RPM packages
        run: npm run tauri -- bundle --bundles deb,rpm --config "$RUNNER_TEMP/sonante-rpm.json"

      - name: Check RPM WebKit dependency resolution without installation
        run: python3 tests/rpm_solver_check.py src-tauri/target/release/bundle/rpm/*.rpm

      - name: Inspect packages and create checksums
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          bash scripts/inspect-packages.sh "$VERSION" | tee package-inspection.txt
          mkdir artifacts
          cp src-tauri/target/release/bundle/deb/*.deb artifacts/
          cp native-abi.txt package-inspection.txt artifacts/
          cd artifacts
          git rev-parse HEAD > source-commit.txt
          sha256sum *.deb source-commit.txt > SHA256SUMS-ubuntu.txt
          sha256sum -c SHA256SUMS-ubuntu.txt

      - name: Upload Ubuntu compilation inputs
        uses: actions/upload-artifact@v4
        with:
          name: sonante-compilation-ubuntu-inputs-${{ inputs.candidate_sha || github.sha }}
          path: artifacts/*
          retention-days: 1
          if-no-files-found: error

      - name: Build Fedora runtime profile executable
        run: |
          # The installed manifest must match the bytes compiled into the app.
          # Preserve the Ubuntu candidates uploaded above before this overlay.
          echo "c93f1ac2dc06a8dcee5101858381efc265c3907e50dc2a334a11d293a21cf02f  packaging/qualified-0.5.4/fedora.runtime.json" | sha256sum -c -
          cp packaging/qualified-0.5.4/fedora.runtime.json packaging/private-runtimes.json
          npm run tauri -- build --no-bundle -- --locked
          mkdir fedora-native
          cp src-tauri/target/release/sonante fedora-native/sonante
          cp packaging/private-runtimes.json fedora-native/manifest.json
          bash scripts/inspect-elf.sh fedora-native/sonante 2.35 openssl3 | tee fedora-native/native-abi.txt
          python3 -c 'from pathlib import Path; p = Path("fedora-native"); assert (p / "manifest.json").read_bytes() in (p / "sonante").read_bytes()'
          git rev-parse HEAD > fedora-native/source-commit.txt
          cd fedora-native
          sha256sum sonante manifest.json native-abi.txt source-commit.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload Fedora runtime profile executable
        uses: actions/upload-artifact@v4
        with:
          name: sonante-compilation-fedora-inputs-${{ inputs.candidate_sha || github.sha }}
          path: fedora-native/*
          retention-days: 1
          if-no-files-found: error

  arch:
    name: Arch Linux package
    runs-on: ubuntu-22.04
    container: archlinux:base-devel
    steps:
      - name: Bootstrap Git for full-history checkout
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
      - name: Install pinned Arch ABI build environment
        run: bash scripts/prepare-arch-abi-build.sh
      - name: Trust exact checkout for container source verification
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify immutable candidate source
        env:
          SONANTE_CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
          SONANTE_EVENT_SHA: ${{ github.sha }}
        run: python3 scripts/verify-candidate-source.py --candidate-sha "$SONANTE_CANDIDATE_SHA" --event-sha "$SONANTE_EVENT_SHA"
      - name: Verify packaging versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/verify-packaging.mjs
      - name: Stage exact checkout and build as an unprivileged user
        run: |
          bash scripts/prepare-arch-ci.sh "$GITHUB_WORKSPACE/arch-build"
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd arch-build
          runuser -u builder -- makepkg --noconfirm --cleanbuild
      - name: Inspect Arch package
        run: |
          cd arch-build
          test "$(find . -maxdepth 1 -name '*.pkg.tar.zst' | wc -l)" = 1
          pacman -Qip ./*.pkg.tar.zst
          pacman -Qlp ./*.pkg.tar.zst
          bsdtar -xOf ./*.pkg.tar.zst .PKGINFO | tee package-info.txt
          VERSION="$(node -p "require('../package.json').version")"
          REVISION="$(sed -n 's/^pkgrel=//p' ../sonante-arch/PKGBUILD)"
          grep -Fx "pkgver = $VERSION-$REVISION" package-info.txt
          for dep in alsa-utils xdg-utils webkit2gtk-4.1 'libcrypto.so=3-64' 'libssl.so=3-64'; do grep -Fx "depend = $dep" package-info.txt; done
          if grep -E '^depend = openssl(=|>=|$)|^depend = lib(crypto|ssl)\.so=[4-9]-64$' package-info.txt; then
            echo 'Arch package must depend on OpenSSL 3 SONAMEs, never OpenSSL 4' >&2
            exit 1
          fi
          bsdtar -tf ./*.pkg.tar.zst | grep -Fx usr/bin/sonante
          desktop-file-validate src/sonante.desktop
          bash ../scripts/inspect-elf.sh src/sonante/src-tauri/target/release/sonante 2.43 openssl3 | tee native-abi-arch.txt
          runuser -u builder -- git -C .. rev-parse HEAD > source-commit.txt
          sha256sum *.pkg.tar.zst source-commit.txt > SHA256SUMS-arch.txt
          sha256sum -c SHA256SUMS-arch.txt
      - name: Upload Arch candidate
        uses: actions/upload-artifact@v4
        with:
          name: sonante-compilation-arch-inputs-${{ inputs.candidate_sha || github.sha }}
          path: |
            arch-build/*.pkg.tar.zst
            arch-build/SHA256SUMS-arch.txt
            arch-build/package-info.txt
            arch-build/native-abi-arch.txt
            arch-build/source-commit.txt
          retention-days: 1
          if-no-files-found: error


  complete:
    name: Complete Linux installers
    needs: [linux, arch]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
      - name: Verify immutable candidate source
        env:
          SONANTE_CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
          SONANTE_EVENT_SHA: ${{ github.sha }}
        run: python3 scripts/verify-candidate-source.py --candidate-sha "$SONANTE_CANDIDATE_SHA" --event-sha "$SONANTE_EVENT_SHA"
      - name: Install packaging tools only
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils dpkg-dev rpm libarchive-tools zstd python3
      - uses: actions/download-artifact@v4
        with:
          name: sonante-compilation-ubuntu-inputs-${{ inputs.candidate_sha || github.sha }}
          path: ${{ runner.temp }}/sonante-candidates/ubuntu
      - uses: actions/download-artifact@v4
        with:
          name: sonante-compilation-fedora-inputs-${{ inputs.candidate_sha || github.sha }}
          path: ${{ runner.temp }}/sonante-candidates/fedora
      - uses: actions/download-artifact@v4
        with:
          name: sonante-compilation-arch-inputs-${{ inputs.candidate_sha || github.sha }}
          path: ${{ runner.temp }}/sonante-candidates/arch
      - name: Assemble and verify complete installers and corresponding sources
        run: |
          python3 scripts/complete-packages.py \
            --candidates "$RUNNER_TEMP/sonante-candidates" \
            --work-dir "$RUNNER_TEMP/sonante-complete-work" \
            --output "$RUNNER_TEMP/sonante-complete-output" \
            --revision "$(sed -n 's/^pkgrel=//p' sonante-arch/PKGBUILD)"
      - name: Upload complete installable packages
        uses: actions/upload-artifact@v4
        with:
          name: sonante-0.7.2-candidate-${{ inputs.candidate_sha || github.sha }}
          path: ${{ runner.temp }}/sonante-complete-output/*
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  compatibility-ubuntu-2204:
    name: Install candidate on Ubuntu 22.04
    needs: complete
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sonante-0.7.2-candidate-${{ inputs.candidate_sha || github.sha }}
          path: ${{ runner.temp }}/sonante-candidate
      - name: Install and load the final DEB
        run: |
          deb="$RUNNER_TEMP/sonante-candidate/sonante_0.7.2-1_amd64.deb"
          test -f "$deb"
          sudo apt-get update
          sudo apt-get install -y "$deb"
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.35'
          ldd -r /usr/bin/sonante | tee "$RUNNER_TEMP/sonante-ubuntu-loader.txt"
          ! grep -E 'not found|undefined symbol' "$RUNNER_TEMP/sonante-ubuntu-loader.txt"

  compatibility-fedora:
    name: Install candidate on Fedora 44
    needs: complete
    runs-on: ubuntu-22.04
    container: fedora:44
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sonante-0.7.2-candidate-${{ inputs.candidate_sha || github.sha }}
          path: /tmp/sonante-candidate
      - name: Install and load the final RPM
        run: |
          rpm_file="/tmp/sonante-candidate/sonante-0.7.2-1.x86_64.rpm"
          test -f "$rpm_file"
          dnf install -y "$rpm_file"
          ldd -r /usr/bin/sonante | tee /tmp/sonante-fedora-loader.txt
          ! grep -E 'not found|undefined symbol' /tmp/sonante-fedora-loader.txt
          rpm -q sonante

  compatibility-arch-current:
    name: Install candidate on current Arch with OpenSSL 3 compatibility
    needs: complete
    runs-on: ubuntu-22.04
    container: archlinux:base-devel
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sonante-0.7.2-candidate-${{ inputs.candidate_sha || github.sha }}
          path: /tmp/sonante-candidate
      - name: Resolve and load package on current Arch
        run: |
          pacman -Syu --noconfirm --needed curl openssl-3 alsa-lib alsa-utils gtk3 webkit2gtk-4.1 xdg-utils xdg-desktop-portal desktop-file-utils
          pacman -T libcrypto.so=3-64 libssl.so=3-64
          pkg="/tmp/sonante-candidate/sonante-0.7.2-1-x86_64.pkg.tar.zst"
          test -f "$pkg"
          pacman -U --noconfirm "$pkg"
          pacman -Q sonante openssl openssl-3
          ldd -r /usr/bin/sonante | tee /tmp/sonante-arch-loader.txt
          ! grep -E 'not found|undefined symbol|lib(crypto|ssl)\.so\.4' /tmp/sonante-arch-loader.txt

          # Check the exact OpenSSL 3.6.5 runtime version used by Manjaro Stable.
          base='https://archive.archlinux.org/packages/o/openssl'
          pkg365='openssl-3.6.5-1-x86_64.pkg.tar.zst'
          curl --fail --location --output "/tmp/$pkg365" "$base/$pkg365"
          curl --fail --location --output "/tmp/$pkg365.sig" "$base/$pkg365.sig"
          pacman-key --verify "/tmp/$pkg365.sig" "/tmp/$pkg365"
          mkdir -m 700 /tmp/sonante-openssl-365
          bsdtar -xf "/tmp/$pkg365" -C /tmp/sonante-openssl-365 usr/lib/libssl.so.3 usr/lib/libcrypto.so.3
          readelf -d /tmp/sonante-openssl-365/usr/lib/libssl.so.3 | grep -F '[libssl.so.3]'
          readelf -d /tmp/sonante-openssl-365/usr/lib/libcrypto.so.3 | grep -F '[libcrypto.so.3]'
          LD_LIBRARY_PATH=/tmp/sonante-openssl-365/usr/lib ldd -r /usr/bin/sonante | tee /tmp/sonante-manjaro-365-loader.txt
          ! grep -E 'not found|undefined symbol|lib(crypto|ssl)\.so\.4' /tmp/sonante-manjaro-365-loader.txt
          grep -F '/tmp/sonante-openssl-365/usr/lib/libssl.so.3' /tmp/sonante-manjaro-365-loader.txt
          grep -F '/tmp/sonante-openssl-365/usr/lib/libcrypto.so.3' /tmp/sonante-manjaro-365-loader.txt
