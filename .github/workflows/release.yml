name: Build complete Linux packages

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA to build from the selected branch
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Build all formats with pinned runtimes, licenses and corresponding sources.
  # This workflow does not create a tag or publish a release.
  packages:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
