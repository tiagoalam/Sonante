name: Bug report
description: Report an issue with a released version of Sonante
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Sonante. Please report problems with a released build and **remove private information** before attaching logs. Do not include passwords, Plex tokens, account names, library paths, or server addresses.
  - type: input
    id: version
    attributes:
      label: Sonante version
      description: For example, 0.6.3
      placeholder: "0.6.3"
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Operating system and distribution
      placeholder: "Ubuntu 22.04 / Fedora 44 / Manjaro, desktop environment"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Music source or feature
      options:
        - Local files
        - Plex
        - Navidrome
        - Online radio
        - Audio output / playback
        - Library / metadata
        - User interface
        - Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Audio device and output mode (if relevant)
      placeholder: "DAC or sound card, Shared / Direct"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that reproduce the problem
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics or screenshots (optional)
      description: You can use About Sonante → Copy diagnostics. Review the content before posting.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked the report and attachments for personal information, paths, credentials, and tokens.
          required: true
