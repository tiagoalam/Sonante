<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Set the persisted palette before styles and the React entry can paint.
      (() => {
        let value = "dark";
        try {
          const r = JSON.parse(localStorage.getItem("sonante_appearance_v1") || "null");
          if (r && r.version === 1 && ["dark", "light", "cyber", "summer", "zen", "nocturne"].includes(r.value) && r.revision &&
            Number.isSafeInteger(r.revision.counter) && r.revision.counter >= 0 &&
            typeof r.revision.origin === "string" && r.revision.origin.length <= 96 && /^[\w-]*$/.test(r.revision.origin)) value = r.value;
        } catch { /* Storage is optional; Dark is the default. */ }
        document.documentElement.dataset.theme = value;
        document.documentElement.style.colorScheme = value === "light" || value === "summer" || value === "zen" ? "light" : "dark";
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri + React + Typescript</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
