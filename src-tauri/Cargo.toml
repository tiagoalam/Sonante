[package]
name = "sonante"
version = "0.6.0"
description = "Linux desktop audio player for local and Plex libraries"
authors = ["Tiago Alam"]
license = "GPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sonante_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tokio = { version = "1", features = ["time", "sync", "macros", "net", "io-util"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
md5 = "=0.8.0"
urlencoding = "2.1"
quick-xml = "=0.42.0"
socket2 = "=0.6.5"
dirs = "5.0"
base64 = "0.22"
gdk-pixbuf = "0.18.5"
reqwest = { version = "0.12", features = ["json"] }
rfd = "0.17.2"
alsa = "0.11"
libc = "0.2"
rustfft = "6.4.1"
mpris-server = "0.10"
lofty = "0.25.4"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Hashing a pinned runtime remains mandatory in DEV; optimize its compression
# routine without changing debug assertions or the application build profile.
[profile.dev.package.sha2]
opt-level = 3
