[package]
name = "sonante"
version = "0.7.0"
description = "Linux desktop audio player for local and Plex libraries"
authors = ["Tiago Alam"]
license = "GPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sonante_lib"
path = "src/entry.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Native experimental packages opt into separate profile/runtime identities.
# Ordinary builds use the public Sonante identity; development overlays remain isolated.
experimental-package = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
sonante-sqlite-catalog = { path = "../experiments/sqlite-catalog" }
tokio = { version = "1", features = ["time", "sync", "macros", "net", "io-util", "fs"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "=0.3.4"
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
md5 = "=0.8.0"
urlencoding = "2.1"
quick-xml = "=0.42.0"
socket2 = "=0.6.5"
dirs = "5.0"
base64 = "0.22"
gdk-pixbuf = "0.18.5"
reqwest = { version = "0.12", features = ["json"] }
rfd = "0.17.2"
alsa = "0.11"
libc = "0.2"
rustfft = "6.4.1"
mpris-server = "0.10"
lofty = "0.25.4"
symphonia = { version = "=0.5.5", default-features = false, features = ["all"] }
rubato = "=1.0.1"
audioadapter-buffers = "=2.0.0"
scarletbook-pcm = "=0.5.7"
tempfile = "=3.27.0"

[target.'cfg(target_os = "windows")'.dependencies]
quick-xml = "=0.42.0"
socket2 = "=0.6.5"
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
symphonia = { version = "=0.5.5", default-features = false, features = ["all"] }
rubato = "=1.0.1"
audioadapter-buffers = "=2.0.0"
scarletbook-pcm = "=0.5.7"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
md5 = { version = "=0.8.0" }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["time", "sync", "macros", "net", "io-util"] }
serde_json = "1"
urlencoding = "=2.1.3"
lofty = "=0.25.4"
base64 = "0.22"
sha2 = "0.10"
getrandom = "=0.3.4"
rfd = "0.17.2"
windows = { version = "=0.61.3", features = ["Foundation", "Media", "Win32_System_WinRT", "Win32_Devices_FunctionDiscovery", "Win32_Graphics_Imaging", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem"] }
windows-sys = { version = "0.61.2", features = ["Win32_Globalization", "Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WNet", "Win32_Networking_WinSock", "Win32_Storage_FileSystem"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Hashing a pinned runtime remains mandatory in DEV; optimize its compression
# routine without changing debug assertions or the application build profile.
[profile.dev.package.sha2]
opt-level = 3
